name: Update Credly Badges

on:
  schedule:
    - cron: '0 0 * * *'   # daily at 00:00 UTC
  workflow_dispatch:      # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: credly-badges
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch badges and update categorized sections
        id: update
        env:
          CREDLY_USERNAME: chandrakanth-mullella
          BADGE_SIZE: '85x85'
          BADGE_SORT_BY: issued
          README_FILE: README.md
        run: python scripts/update_certifications.py

      - name: Commit and push if changed
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Auto-update certification badges from Credly"
          git push